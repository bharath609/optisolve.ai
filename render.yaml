services:
  - type: web
    name: optiforge-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: EXPLABS_API_KEY
        sync: false
      - key: EXPERIENTIAL_BASE_URL
        value: https://api.experientiallabs.ai/v1
      - key: EXPERIENTIAL_MODEL
        value: gpt-6-astra
      - key: SIMPLE_AI_API_KEY
        sync: false
      - key: SIMPLE_AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: SIMPLE_AI_MODEL
        value: llama-3.1-8b-instant
      - key: FRONTEND_ORIGINS
        value: https://optisolve.ai,https://www.optisolve.ai,https://optiforge-ai.vercel.app,https://optiforge.ai,https://www.optiforge.ai
